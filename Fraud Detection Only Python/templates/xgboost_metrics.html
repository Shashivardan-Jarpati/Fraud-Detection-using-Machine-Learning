<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <title>XGBoost Metrics</title>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <span class="navbar-brand">
                <svg width="32" height="32" viewBox="0 0 32 32" style="display: inline-block; vertical-align: middle; margin-right: 8px;">
                    <path d="M16 2 L28 8 L28 16 C28 24 16 30 16 30 C16 30 4 24 4 16 L4 8 Z" 
                          fill="#6b4423" stroke="#8b6f47" stroke-width="1.5"/>
                    <rect x="12" y="15" width="8" height="7" rx="1" fill="#D8C9A7"/>
                    <path d="M13 15 L13 12 C13 10.3 14.3 9 16 9 C17.7 9 19 10.3 19 12 L19 15" 
                          stroke="#D8C9A7" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <circle cx="16" cy="18" r="1.2" fill="#6b4423"/>
                    <rect x="15.4" y="18" width="1.2" height="2.5" fill="#6b4423"/>
                </svg>
                XGBoost Results
            </span>
        </div>
    </nav>

    <div class="container">
        <div class="hero-section">
            <h1>XGBoost Model Performance</h1>
            <p class="subtitle">Extreme Gradient Boosting for High-Performance Classification</p>
        </div>

        <div class="metrics-card">
            <div class="metrics-grid">
                <div class="metric-item">
                    <div class="metric-label">Accuracy</div>
                    <div class="metric-value">{{ accuracy }}</div>
                </div>

                <div class="metric-item">
                    <div class="metric-label">Precision</div>
                    <div class="metric-value">{{ precision }}</div>
                </div>

                <div class="metric-item">
                    <div class="metric-label">Recall</div>
                    <div class="metric-value">{{ recall }}</div>
                </div>

                <div class="metric-item">
                    <div class="metric-label">F1 Score</div>
                    <div class="metric-value">{{ f1 }}</div>
                </div>

                <div class="metric-item">
                    <div class="metric-label">ROC-AUC Score</div>
                    <div class="metric-value">{{ roc_auc }}</div>
                </div>
            </div>

            <div class="action-section">
                <a href="{{ url_for('index') }}" class="btn-home">← Return to Home</a>
            </div>
        </div>
    </div>
</body>
</html>
